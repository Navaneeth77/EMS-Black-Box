[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ems-black-box"
version = "0.1.0"
description = "Counterfactual replay of ambulance trips through simulated Bengaluru traffic"
requires-python = ">=3.11"
dependencies = []

# ems_sim and ems_analysis are libraries imported by the backend, the tests and
# ad-hoc scripts. Installing them editable (`pip install -e .`) means imports
# resolve the same way everywhere instead of depending on sys.path juggling.
[tool.setuptools]
package-dir = { "ems_sim" = "simulation/ems_sim", "ems_analysis" = "analysis/ems_analysis" }

[tool.setuptools.packages.find]
where = ["simulation", "analysis"]
include = ["ems_sim*", "ems_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "simulation", "analysis"]
addopts = "-ra --strict-markers"
markers = [
    "sumo: requires a working SUMO installation",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
